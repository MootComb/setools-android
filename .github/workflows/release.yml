name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  TOOL_NAME: setools-android

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read_version.outputs.version }}
      tag: ${{ steps.read_version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Read VERSION
        id: read_version
        run: |
          if [ ! -f VERSION ]; then
            echo "VERSION file not found" >&2
            exit 1
          fi
          VERSION="$(grep -v '^[[:space:]]*$' VERSION | head -n1 | tr -d '[:space:]')"
          if [ -z "$VERSION" ]; then
            echo "VERSION file is empty" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # NDK ABIs, not Linux ABIs:
          #   arm64-v8a   -> aarch64
          #   armeabi-v7a -> armv7l
          #   x86_64      -> x86_64
          #   x86         -> i686
          - ndk_abi: arm64-v8a
            abi: aarch64
          - ndk_abi: armeabi-v7a
            abi: armv7l
          - ndk_abi: x86_64
            abi: x86_64
          - ndk_abi: x86
            abi: i686
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Build with ndk-build
        run: |
          set -e
          echo "NDK ABI: ${{ matrix.ndk_abi }}"
          # Build only the requested ABI. The project uses jni/Android.mk
          # and jni/Application.mk at the top of the jni/ tree.
          ndk-build \
            -C jni \
            NDK_PROJECT_PATH=. \
            APP_ABI=${{ matrix.ndk_abi }} \
            APP_PLATFORM=android-21 \
            V=1

      - name: Collect utilities
        id: collect
        run: |
          set -e
          # ndk-build puts final binaries in libs/<abi>/ and
          # intermediate objects in obj/local/<abi>/.
          # Standalone utilities (if any) end up in libs/<abi>/ too,
          # because Android.mk uses BUILD_EXECUTABLE.
          UTILS=""
          for d in "libs/${{ matrix.ndk_abi }}" "obj/local/${{ matrix.ndk_abi }}"; do
            [ -d "$d" ] || continue
            for f in "$d"/*; do
              [ -f "$f" ] || continue
              base="$(basename "$f")"
              case "$base" in
                *.o|*.a|*.so|*.so.*|*.d|*.h|*.c|*.cc|*.cpp|*.hpp|*.sh|Makefile|makefile|GNUmakefile|VERSION|README*|LICENSE*|*.txt|*.md|*.tar.gz|*.sha256)
                  continue
                  ;;
              esac
              if head -c4 "$f" | od -An -tx1 | tr -d ' \n' | grep -q '^7f454c46$'; then
                if [ -x "$f" ]; then
                  UTILS="$UTILS $d/$base"
                fi
              fi
            done
          done
          UTILS="$(echo $UTILS | tr ' ' '\n' | sort -u | tr '\n' ' ')"
          if [ -z "$UTILS" ]; then
            echo "No ELF executables found after build" >&2
            echo "Files in libs/${{ matrix.ndk_abi }} and obj/local/${{ matrix.ndk_abi }}:" >&2
            ls -la "libs/${{ matrix.ndk_abi }}" 2>/dev/null >&2 || true
            ls -la "obj/local/${{ matrix.ndk_abi }}" 2>/dev/null >&2 || true
            exit 1
          fi
          echo "Utilities: $UTILS"
          echo "utils=$UTILS" >> "$GITHUB_OUTPUT"

      - name: Package
        env:
          UTILS: ${{ steps.collect.outputs.utils }}
        run: |
          set -e
          VERSION="${{ needs.prepare.outputs.version }}"
          ABI="${{ matrix.abi }}"
          NAME="${TOOL_NAME}-${ABI}-${VERSION}"

          mkdir -p "dist/$NAME" dist/bin

          for U in $UTILS; do
            base="$(basename "$U")"
            cp -a "$U" "dist/$NAME/$base"
          done
          cp -a README* "dist/$NAME/" 2>/dev/null || true
          cp -a VERSION "dist/$NAME/" 2>/dev/null || true
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          sha256sum "dist/$NAME.tar.gz" > "dist/$NAME.tar.gz.sha256"

          for U in $UTILS; do
            base="$(basename "$U")"
            OUT="dist/bin/${base}-${ABI}-${VERSION}"
            cp -a "$U" "$OUT"
            chmod +x "$OUT"
            sha256sum "$OUT" > "${OUT}.sha256"
          done

          ls -lR dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TOOL_NAME }}-${{ matrix.abi }}-${{ needs.prepare.outputs.version }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/bin/*

  release:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lR artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ env.TOOL_NAME }} ${{ needs.prepare.outputs.version }}
          body: |
            Release ${{ needs.prepare.outputs.version }} of ${{ env.TOOL_NAME }}.

            ## Assets

            Full archives per architecture:

            - `setools-android-<abi>-<version>.tar.gz`
            - `setools-android-<abi>-<version>.tar.gz.sha256`

            Standalone binaries (no archive), one per utility per architecture:

            - `<utility>-<abi>-<version>`
            - `<utility>-<abi>-<version>.sha256`

            Supported ABIs: `aarch64`, `armv7l`, `x86_64`, `i686`.

            ## Changes
            - Support for injecting multiple rules at once
            - Support for rules files
            - Fixed compilation on newer platforms
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
            artifacts/*-*-*.sha256
            artifacts/*-*-*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
