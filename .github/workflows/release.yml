name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  TOOL_NAME: setools-android

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read_version.outputs.version }}
      tag: ${{ steps.read_version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Read VERSION
        id: read_version
        run: |
          if [ ! -f VERSION ]; then
            echo "VERSION file not found" >&2
            exit 1
          fi
          VERSION="$(grep -v '^[[:space:]]*$' VERSION | head -n1 | tr -d '[:space:]')"
          if [ -z "$VERSION" ]; then
            echo "VERSION file is empty" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: x86_64
            cc: gcc
            apt: gcc make libsepol-dev
            cflags: ""
          - abi: aarch64
            cc: aarch64-linux-gnu-gcc
            apt: gcc-aarch64-linux-gnu make libsepol-dev
            cflags: ""
          - abi: armv7l
            cc: arm-linux-gnueabihf-gcc
            apt: gcc-arm-linux-gnueabihf make libsepol-dev
            cflags: ""
          - abi: i686
            cc: gcc
            apt: gcc make gcc-multilib libc6-dev-i386 libsepol-dev
            cflags: "-m32"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - name: Build
        env:
          CC: ${{ matrix.cc }}
          EXTRA_CFLAGS: ${{ matrix.cflags }}
        run: |
          set -e
          make clean || true
          make CC="$CC" CFLAGS="-O2 -Wall $EXTRA_CFLAGS"

      - name: Collect utilities
        id: collect
        run: |
          set -e
          # Find ELF executables in the project root and in src/, bin/, build/
          # and exclude object files, libraries, build scripts, and docs.
          UTILS=""
          for d in . src bin build; do
            [ -d "$d" ] || continue
            for f in "$d"/*; do
              [ -f "$f" ] || continue
              base="$(basename "$f")"
              case "$base" in
                *.o|*.a|*.so|*.so.*|*.d|*.h|*.c|*.cc|*.cpp|*.hpp|*.sh|Makefile|makefile|GNUmakefile|VERSION|README*|LICENSE*|*.txt|*.md|*.tar.gz|*.sha256)
                  continue
                  ;;
              esac
              # ELF magic check
              if head -c4 "$f" | od -An -tx1 | tr -d ' \n' | grep -q '^7f454c46$'; then
                if [ -x "$f" ]; then
                  if [ "$d" = "." ]; then
                    UTILS="$UTILS $base"
                  else
                    UTILS="$UTILS $d/$base"
                  fi
                fi
              fi
            done
          done
          UTILS="$(echo $UTILS | tr ' ' '\n' | sort -u | tr '\n' ' ')"
          if [ -z "$UTILS" ]; then
            echo "No ELF executables found after build" >&2
            echo "Files in tree:" >&2
            find . -maxdepth 2 -type f -exec file {} \; >&2 || true
            exit 1
          fi
          echo "Utilities: $UTILS"
          echo "utils=$UTILS" >> "$GITHUB_OUTPUT"

      - name: Package
        env:
          UTILS: ${{ steps.collect.outputs.utils }}
        run: |
          set -e
          VERSION="${{ needs.prepare.outputs.version }}"
          ABI="${{ matrix.abi }}"
          NAME="${TOOL_NAME}-${ABI}-${VERSION}"

          mkdir -p "dist/$NAME" dist/bin

          # 1) Full archive with all utilities
          for U in $UTILS; do
            base="$(basename "$U")"
            cp -a "$U" "dist/$NAME/$base"
          done
          cp -a README* "dist/$NAME/" 2>/dev/null || true
          cp -a VERSION "dist/$NAME/" 2>/dev/null || true
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          sha256sum "dist/$NAME.tar.gz" > "dist/$NAME.tar.gz.sha256"

          # 2) Standalone binaries without tar.gz, with ABI and version in the name
          for U in $UTILS; do
            base="$(basename "$U")"
            OUT="dist/bin/${base}-${ABI}-${VERSION}"
            cp -a "$U" "$OUT"
            chmod +x "$OUT"
            sha256sum "$OUT" > "${OUT}.sha256"
          done

          ls -lR dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TOOL_NAME }}-${{ matrix.abi }}-${{ needs.prepare.outputs.version }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/bin/*

  release:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lR artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ env.TOOL_NAME }} ${{ needs.prepare.outputs.version }}
          body: |
            Release ${{ needs.prepare.outputs.version }} of ${{ env.TOOL_NAME }}.

            ## Assets

            Full archives per architecture:

            - `setools-android-<abi>-<version>.tar.gz`
            - `setools-android-<abi>-<version>.tar.gz.sha256`

            Standalone binaries (no archive), one per utility per architecture:

            - `<utility>-<abi>-<version>`
            - `<utility>-<abi>-<version>.sha256`

            Supported ABIs: `x86_64`, `aarch64`, `armv7l`, `i686`.

            ## Changes
            - Support for injecting multiple rules at once
            - Support for rules files
            - Fixed compilation on newer platforms
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
            artifacts/*-*-*.sha256
            artifacts/*-*-*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
